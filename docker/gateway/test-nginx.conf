events {}
http {
  map $host $allowed_mail_host { default 0; include /data/routes/hosts.map; }
  server {
    listen 8080;
    listen 8443 ssl;
    ssl_certificate /data/tls/fullchain.pem;
    ssl_certificate_key /data/tls/privkey.pem;
    client_max_body_size 25m;
    location /.well-known/acme-challenge/ { root /data/acme; }
    location / {
      if ($allowed_mail_host = 0) { return 444; }
      proxy_pass http://roundcube:80;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy same-origin always;
      add_header Strict-Transport-Security "max-age=31536000" always;
    }
  }
}
